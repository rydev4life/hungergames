<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena Tracker — 100th Hunger Games</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background:#0a0a0a;
  color:#E8D9B5;
  font-family:'Cinzel',serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.top-bar {
  display:flex;
  align-items:center;
  gap:14px;
  padding:7px 18px;
  background:#0c0c0c;
  border-bottom:2px solid #C9A84C;
  flex-shrink:0;
}
.top-title {
  font-family:'Press Start 2P',monospace;
  font-size:8px;
  color:#C9A84C;
  letter-spacing:1px;
}
.stat-group { display:flex; gap:18px; margin-left:auto; }
.stat { display:flex; flex-direction:column; align-items:center; gap:2px; }
.stat-num { font-family:'Press Start 2P',monospace; font-size:13px; color:#C9A84C; }
.stat-num.red { color:#FF6B6B; }
.stat-num.blue { color:#74B9E8; }
.stat-label { font-family:'Press Start 2P',monospace; font-size:5px; color:#5A4A30; letter-spacing:1px; }
.live-dot { width:8px;height:8px;background:#FF6B6B;border-radius:50%;animation:blink 1s infinite;flex-shrink:0; }

.tbtn {
  background:rgba(201,168,76,0.1);
  border:1px solid rgba(201,168,76,0.35);
  color:#C9A84C;
  padding:4px 11px;
  font-family:'Press Start 2P',monospace;
  font-size:6px;
  cursor:pointer;
  letter-spacing:1px;
  text-decoration:none;
  white-space:nowrap;
}
.tbtn:hover{background:rgba(201,168,76,0.22);}
.arena-wrap {
  flex:1;
  display:flex;
  min-height:0;
  overflow:hidden;
  position:relative;
}
#arenaCanvas {
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  display:block;
  cursor:default;

.legend {
  width:160px;
  flex-shrink:0;
  background:#0c0c0c;

  overflow-y:auto;
  padding:10px 8px;
  scrollbar-width:thin;
  scrollbar-color:#3a3020 transparent;
}
.legend-title {
  font-family:'Press Start 2P',monospace;
  font-size:6px;
  color:#C9A84C;

  margin-bottom:10px;
  text-align:center;

.legend-item {
  display:flex;

  gap:6px;

.legend-item:hover{background:rgba(201,168,76,0.08);}
.legend-item.dead{opacity:0.3;}
.legend-dot {
  width:10px;height:10px;
  border-radius:2px;
  flex-shrink:0;
  border:1px solid rgba(255,255,255,0.15);
}

  font-family:'Press Start 2P',monospace;

<script type="module">
import{initializeApp,getApps}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getDatabase,ref,onValue,update}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const FB={apiKey:"AIzaSyCZpSWAEivu4NAepXVIY2JyeFoBx6mTayA",authDomain:"hunger-games-uns.firebaseapp.com",databaseURL:"https://hunger-games-uns-default-rtdb.firebaseio.com",projectId:"hunger-games-uns",storageBucket:"hunger-games-uns.firebasestorage.app",messagingSenderId:"833806319484",appId:"1:833806319484:web:39b7af0875360e4d4f6ef9"};
const app=getApps().length?getApps()[0]:initializeApp(FB);
const db=getDatabase(app);

// ─── CONSTANTS ────────────────────────────────────────────────
const COLS=80, ROWS=80, T=20; // 80x80 tiles, 20px each = 1600x1600 canvas
const canvas=document.getElementById('arenaCanvas');
const ctx=canvas.getContext('2d');
canvas.width=COLS*T;
canvas.height=ROWS*T;

// Viewport (camera)
let camX=0, camY=0;

function fitCanvas(){
  const wrap=document.querySelector('.arena-wrap');
  const W=wrap.clientWidth-160;
  const H=wrap.clientHeight;
  const scale=Math.min(W/canvas.width, H/canvas.height);
  canvas.style.width=Math.floor(canvas.width*scale)+'px';
  canvas.style.height=Math.floor(canvas.height*scale)+'px';
}
fitCanvas();
window.addEventListener('resize',fitCanvas);

// ─── TILE TYPES ───────────────────────────────────────────────
const TILE={
  GRASS:0, GRASS2:1, GRASS3:2,
  TREE:3, TREE2:4, PINE:5,
  WATER:6, SHALLOW:7,
  STONE:8, CLIFF:9,
  DIRT:10, PATH:11,
  GOLD:12,
  SAND:13, SAND2:14,
  FLOWER:15, MUSHROOM:16,
  LAVA:17, ASH:18,
};

// Rich colour palettes per tile type
const TC={
  [TILE.GRASS]:   ['#3d8b3d','#4a9c4a','#357535','#429442'],
  [TILE.GRASS2]:  ['#4a8a3a','#568a40','#3d7530','#4d8038'],
  [TILE.GRASS3]:  ['#2d6b2d','#356535','#286028','#306030'],
  [TILE.TREE]:    ['#1a4d18','#1f5c1c','#163f14','#1c5018'],
  [TILE.TREE2]:   ['#0f3a0d','#144014','#0c320a','#123a10'],
  [TILE.PINE]:    ['#0d3020','#103828','#0a2818','#0e3422'],
  [TILE.WATER]:   ['#1a4a8a','#1e5496','#163d7a','#1a4880'],
  [TILE.SHALLOW]: ['#2a6aa8','#3070b0','#2460a0','#2868a8'],
  [TILE.STONE]:   ['#5a5a5a','#525252','#626262','#4e4e4e'],
  [TILE.CLIFF]:   ['#3a3a3a','#333333','#404040','#2e2e2e'],
  [TILE.DIRT]:    ['#6a4a2a','#7a5535','#604020','#705030'],
  [TILE.PATH]:    ['#8a7050','#9a8060','#7a6040','#856a4a'],
  [TILE.GOLD]:    ['#C9A84C','#d4b456','#b89230','#c8a040'],
  [TILE.SAND]:    ['#c8a870','#d0b07a','#c09860','#c8a468'],
  [TILE.SAND2]:   ['#b89460','#c0a068','#a88450','#b89060'],
  [TILE.FLOWER]:  ['#4a9c4a','#4a9c4a','#4a9c4a','#4a9c4a'],
  [TILE.MUSHROOM]:['#3d8b3d','#3d8b3d','#3d8b3d','#3d8b3d'],
  [TILE.LAVA]:    ['#cc4400','#dd5500','#bb3300','#cc4800'],
  [TILE.ASH]:     ['#444440','#4a4a46','#3e3e3a','#484844'],
};

// ─── MAP GENERATION ───────────────────────────────────────────
const map=new Uint8Array(COLS*ROWS);
const M=(r,c)=>r*COLS+c;

function noise(r,c,seed=0){
  // Simple deterministic noise
  let v=Math.sin(r*0.3+seed)*Math.cos(c*0.3+seed*1.3)*43758.5453;
  return v-Math.floor(v);
}

function generateArena(){
  // Base: all grass
  for(let i=0;i<COLS*ROWS;i++) map[i]=TILE.GRASS;

  // Grass variation
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const n=noise(r,c,1);
    if(n<0.3) map[M(r,c)]=TILE.GRASS2;
    else if(n<0.15) map[M(r,c)]=TILE.GRASS3;
  }

  // ── DENSE FOREST RINGS ──
  // NW forest (quadrant 1 - thick)
  for(let r=0;r<30;r++) for(let c=0;c<30;c++){
    const d=Math.sqrt(r*r+c*c);
    if(d<28&&noise(r,c,2)>0.25) map[M(r,c)]=noise(r,c,3)>0.5?TILE.TREE:TILE.TREE2;
    else if(d<32&&noise(r,c,4)>0.4) map[M(r,c)]=TILE.PINE;
  }

  // NE forest (rocky highland)
  for(let r=0;r<25;r++) for(let c=55;c<80;c++){
    if(noise(r,c,5)>0.3) map[M(r,c)]=noise(r,c,6)>0.5?TILE.CLIFF:TILE.STONE;
    else if(noise(r,c,7)>0.4) map[M(r,c)]=TILE.PINE;
  }

  // SE desert
  for(let r=54;r<80;r++) for(let c=54;c<80;c++){
    map[M(r,c)]=noise(r,c,8)>0.4?TILE.SAND:TILE.SAND2;
    if(noise(r,c,9)>0.75) map[M(r,c)]=TILE.DIRT;
  }

  // SW lake (large)
  const LCR=65,LCC=15,LRR=10,LRC=12;
  for(let r=50;r<78;r++) for(let c=2;c<30;c++){
    const dr=(r-LCR)/LRR, dc=(c-LCC)/LRC;
    const dist=dr*dr+dc*dc;
    if(dist<0.7) map[M(r,c)]=TILE.WATER;
    else if(dist<1.0) map[M(r,c)]=TILE.SHALLOW;
  }

  // Central mixed forest
  for(let r=10;r<70;r++) for(let c=10;c<70;c++){
    if(map[M(r,c)]===TILE.GRASS&&noise(r,c,10)>0.7){
      map[M(r,c)]=TILE.TREE;
    }
  }

  // Scattered flowers and mushrooms
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(map[M(r,c)]===TILE.GRASS&&noise(r,c,11)>0.88) map[M(r,c)]=TILE.FLOWER;
    if(map[M(r,c)]===TILE.GRASS3&&noise(r,c,12)>0.9) map[M(r,c)]=TILE.MUSHROOM;
  }

  // ── PATHS radiating from centre ──
  const paths=[
    {dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1},
    {dr:-1,dc:-1},{dr:-1,dc:1},{dr:1,dc:-1},{dr:1,dc:1}
  ];
  paths.forEach(({dr,dc})=>{
    let r=40,c=40;
    for(let i=0;i<38;i++){
      r=Math.max(0,Math.min(ROWS-1,Math.round(r+dr)));
      c=Math.max(0,Math.min(COLS-1,Math.round(c+dc)));
      map[M(r,c)]=TILE.PATH;
      if(noise(r,c,13)>0.5&&map[M(r,c+1)]!==TILE.WATER) map[M(r,c+1)]=TILE.PATH;
    }
  });

  // ── CORNUCOPIA clearing ──
  for(let r=34;r<46;r++) for(let c=34;c<46;c++){
    map[M(r,c)]=TILE.DIRT;
  }
  // Gold Cornucopia tiles
  [[39,39],[39,40],[40,39],[40,40],[38,40],[40,41],[39,38],[41,40]].forEach(([r,c])=>{
    map[M(r,c)]=TILE.GOLD;
  });
}

generateArena();

// ─── TILE RENDERER ────────────────────────────────────────────
function drawTile(r,c){
  const type=map[M(r,c)];
  const pal=TC[type]||TC[TILE.GRASS];
  const shade=(r*7+c*13)%pal.length;
  const x=c*T, y=r*T;

  ctx.fillStyle=pal[shade];
  ctx.fillRect(x,y,T,T);

  // Pixel details per tile type
  if(type===TILE.TREE||type===TILE.TREE2){
    // Tree trunk
    ctx.fillStyle='#5a3a1a';
    ctx.fillRect(x+8,y+13,4,7);
    // Canopy layers
    ctx.fillStyle=type===TILE.TREE?'#1a5c18':'#0d3a0b';
    ctx.fillRect(x+3,y+8,14,8);
    ctx.fillStyle=type===TILE.TREE?'#2a7a28':'#14500f';
    ctx.fillRect(x+5,y+4,10,7);
    ctx.fillStyle=type===TILE.TREE?'#3a9035':'#1a6014';
    ctx.fillRect(x+7,y+1,6,5);
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.fillRect(x+2,y+14,16,4);

  } else if(type===TILE.PINE){
    ctx.fillStyle='#5a3a1a';
    ctx.fillRect(x+9,y+14,2,6);
    ctx.fillStyle='#0c3a20';
    ctx.fillRect(x+2,y+12,16,8);
    ctx.fillStyle='#104828';
    ctx.fillRect(x+4,y+7,12,7);
    ctx.fillStyle='#145e32';
    ctx.fillRect(x+6,y+3,8,6);
    ctx.fillStyle='#186040';
    ctx.fillRect(x+8,y+0,4,5);

  } else if(type===TILE.WATER){
    // Animated water shimmer
    const t2=Math.floor(Date.now()/600);
    ctx.fillStyle='rgba(255,255,255,0.06)';
    ctx.fillRect(x,y+((t2+c)%3)*6,T,2);
    ctx.fillRect(x,y+((t2+c+1)%3)*6+2,T,1);
    ctx.fillStyle='rgba(30,80,180,0.3)';
    ctx.fillRect(x+2,y+4,4,2);
    ctx.fillRect(x+12,y+12,5,2);

  } else if(type===TILE.SHALLOW){
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.fillRect(x+1,y+5,T-2,2);
    ctx.fillRect(x+3,y+13,T-6,1);

  } else if(type===TILE.STONE){
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.fillRect(x,y,8,2);
    ctx.fillRect(x+12,y+10,6,2);
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.fillRect(x,y+T-3,T,3);

  } else if(type===TILE.CLIFF){
    ctx.fillStyle='rgba(255,255,255,0.06)';
    ctx.fillRect(x+2,y+2,4,2);
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.fillRect(x,y+T-4,T,4);
    ctx.fillRect(x+T-3,y,3,T);

  } else if(type===TILE.GOLD){
    // Cornucopia gold shimmer
    const shimmer=Math.sin(Date.now()/400+r+c)*0.15+0.15;
    ctx.fillStyle=`rgba(255,220,80,${shimmer})`;
    ctx.fillRect(x,y,T,T);
    ctx.fillStyle='#ffdd44';
    ctx.fillRect(x+6,y+6,8,8);
    ctx.fillStyle='#ffaa00';
    ctx.fillRect(x+8,y+8,4,4);
    ctx.fillStyle='rgba(255,255,200,0.4)';
    ctx.fillRect(x+4,y+4,2,2);

  } else if(type===TILE.SAND||type===TILE.SAND2){
    ctx.fillStyle='rgba(255,255,255,0.06)';
    ctx.fillRect(x+3,y+3,3,1);
    ctx.fillRect(x+12,y+14,5,1);
    ctx.fillStyle='rgba(0,0,0,0.08)';
    ctx.fillRect(x+8,y+8,4,3);

  } else if(type===TILE.DIRT||type===TILE.PATH){
    ctx.fillStyle='rgba(0,0,0,0.1)';
    ctx.fillRect(x+2,y+2,3,2);
    ctx.fillRect(x+14,y+12,3,2);

  } else if(type===TILE.FLOWER){
    // Flower on grass
    ctx.fillStyle=pal[shade];
    ctx.fillRect(x,y,T,T);
    const fColors=['#FF88AA','#FFAA44','#FF4488','#AAFF44','#44AAFF'];
    const fc=fColors[(r*3+c*7)%fColors.length];
    ctx.fillStyle=fc;
    ctx.fillRect(x+7,y+7,6,6);
    ctx.fillStyle='#FFEE44';
    ctx.fillRect(x+9,y+9,2,2);
    ctx.fillStyle='#2a7530';
    ctx.fillRect(x+9,y+13,2,4);

  } else if(type===TILE.MUSHROOM){
    ctx.fillStyle='#e8e0c8';
    ctx.fillRect(x+8,y+10,4,6);
    ctx.fillStyle='#cc3322';
    ctx.fillRect(x+5,y+5,10,7);
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillRect(x+7,y+6,2,2);
    ctx.fillRect(x+11,y+8,2,2);
  }
}

// ─── FULL MAP RENDER TO OFFSCREEN ────────────────────────────
const offscreen=document.createElement('canvas');
offscreen.width=canvas.width;
offscreen.height=canvas.height;
const octx=offscreen.getContext('2d');

function prebakeMap(){
  const saved=ctx;
  // Swap to offscreen
  const oc=offscreen.getContext('2d');
  // Temporarily redirect drawTile to offscreen
  const orig=ctx;
  // We'll just draw directly
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const type=map[M(r,c)];
    const pal=TC[type]||TC[TILE.GRASS];
    const shade=(r*7+c*13)%pal.length;
    const x=c*T,y=r*T;
    oc.fillStyle=pal[shade];
    oc.fillRect(x,y,T,T);
    // Static details only (no animation)
    if(type===TILE.TREE||type===TILE.TREE2){
      oc.fillStyle='#5a3a1a';
      oc.fillRect(x+8,y+13,4,7);
      oc.fillStyle=type===TILE.TREE?'#1a5c18':'#0d3a0b';
      oc.fillRect(x+3,y+8,14,8);
      oc.fillStyle=type===TILE.TREE?'#2a7a28':'#14500f';
      oc.fillRect(x+5,y+4,10,7);
      oc.fillStyle=type===TILE.TREE?'#3a9035':'#1a6014';
      oc.fillRect(x+7,y+1,6,5);
    } else if(type===TILE.PINE){
      oc.fillStyle='#5a3a1a';
      oc.fillRect(x+9,y+14,2,6);
      oc.fillStyle='#0c3a20';
      oc.fillRect(x+2,y+12,16,8);
      oc.fillStyle='#104828';
      oc.fillRect(x+4,y+7,12,7);
      oc.fillStyle='#145e32';
      oc.fillRect(x+6,y+3,8,6);
      oc.fillStyle='#186040';
      oc.fillRect(x+8,y+0,4,5);
    } else if(type===TILE.STONE){
      oc.fillStyle='rgba(255,255,255,0.08)';
      oc.fillRect(x,y,8,2);
      oc.fillStyle='rgba(0,0,0,0.25)';
      oc.fillRect(x,y+T-3,T,3);
    } else if(type===TILE.CLIFF){
      oc.fillStyle='rgba(255,255,255,0.06)';
      oc.fillRect(x+2,y+2,4,2);
      oc.fillStyle='rgba(0,0,0,0.35)';
      oc.fillRect(x,y+T-4,T,4);
    } else if(type===TILE.SAND||type===TILE.SAND2){
      oc.fillStyle='rgba(255,255,255,0.06)';
      oc.fillRect(x+3,y+3,3,1);
      oc.fillRect(x+12,y+14,5,1);
    } else if(type===TILE.DIRT||type===TILE.PATH){
      oc.fillStyle='rgba(0,0,0,0.1)';
      oc.fillRect(x+2,y+2,3,2);
    } else if(type===TILE.FLOWER){
      const fColors=['#FF88AA','#FFAA44','#FF4488','#AAFF44','#44AAFF'];
      const fc=fColors[(r*3+c*7)%fColors.length];
      oc.fillStyle=fc;
      oc.fillRect(x+7,y+7,6,6);
      oc.fillStyle='#FFEE44';
      oc.fillRect(x+9,y+9,2,2);
      oc.fillStyle='#2a7530';
      oc.fillRect(x+9,y+13,2,4);
    } else if(type===TILE.MUSHROOM){
      oc.fillStyle='#e8e0c8';
      oc.fillRect(x+8,y+10,4,6);
      oc.fillStyle='#cc3322';
      oc.fillRect(x+5,y+5,10,7);
    }
  }
}
prebakeMap();

// ─── DISTRICT COLOURS ─────────────────────────────────────────
const DC={
  1:'#FFD700',2:'#FF4444',3:'#00AAFF',4:'#00DDAA',
  5:'#FF8800',6:'#CC44FF',7:'#44CC44',8:'#FF44AA',
  9:'#DDDD00',10:'#FF7744',11:'#44FFCC',12:'#AAAAAA'
};

// ─── TRIBUTES ─────────────────────────────────────────────────
const TRIBUTES=[

  {id:'t05',name:'Synrik Orion',   short:'SYNRIK',  district:3, sx:8, sy:8 },
  {id:'t06',name:'Elena A.',       short:'ELENA',   district:3, sx:10,sy:5 },
  {id:'t07',name:'Corven Tide',    short:'CORVEN',  district:4, sx:70,sy:8 },
  {id:'t08',name:'Tori Vegah',     short:'TORI',    district:4, sx:73,sy:5 },

  {id:'t13',name:'Plutonus Blu',   short:'PLUTO',   district:7, sx:38,sy:5 },

const tributes=TRIBUTES.map(t=>({
  ...t,
  px:t.sx*T, py:t.sy*T,
  targetPx:t.sx*T, targetPy:t.sy*T,
  alive:true, hp:100,
  frame:0, frameTimer:0,
  dir:'down',
  wanderTimer:Math.floor(Math.random()*240),
  deathTimer:0,
  isMoving:false,
}));

// ─── FIREBASE ─────────────────────────────────────────────────
onValue(ref(db,'arenaPositions'),snap=>{
  if(!snap.exists())return;
  const data=snap.val();
  tributes.forEach(t=>{
    const d=data[t.id];
    if(d?.targetX!==undefined){ t.targetPx=d.targetX; t.targetPy=d.targetY; }
  });
});

onValue(ref(db,'tributes'),snap=>{
  if(!snap.exists())return;
  const data=snap.val();
  Object.entries(data).forEach(([id,val])=>{
    const t=tributes.find(x=>x.id===id);
    if(!t)return;
    if(val.alive===false&&t.alive){ t.alive=false; t.deathTimer=60; }
    if(val.hp!==undefined) t.hp=val.hp;
  });
  buildLegend();
  updateStats();
});

onValue(ref(db,'stats'),snap=>{
  if(!snap.exists())return;
  const s=snap.val();
  document.getElementById('sAlive').textContent=s.alive??24;
  document.getElementById('sDead').textContent=s.dead??0;
  document.getElementById('sDay').textContent=s.day??1;
});

let lastCannonTs=0;
onValue(ref(db,'cannonEvent'),snap=>{
  if(!snap.exists())return;
  const ev=snap.val();
  if(!ev?.ts||ev.ts<=lastCannonTs||Date.now()-ev.ts>10000)return;
  lastCannonTs=ev.ts;
  // Red flash on canvas border
  canvas.style.boxShadow='0 0 80px rgba(255,50,50,0.95)';
  setTimeout(()=>{ canvas.style.boxShadow='none'; },2000);
});

function updateStats(){
  const alive=tributes.filter(t=>t.alive).length;
  document.getElementById('sAlive').textContent=alive;
  document.getElementById('sDead').textContent=24-alive;
}

// ─── LEGEND ───────────────────────────────────────────────────
function buildLegend(){
  const list=document.getElementById('legendList');
  list.innerHTML='';
  tributes.forEach(t=>{
    const div=document.createElement('div');
    div.className='legend-item'+(t.alive?'':' dead');
    div.id='leg-'+t.id;
    div.innerHTML=`
      <div class="legend-dot" style="background:${DC[t.district]}"></div>
      <div>
        <div class="legend-name">${t.short}</div>
        <div class="legend-district">D${t.district}</div>
      </div>`;
    div.onclick=()=>{ selectedId=t.id; };
    list.appendChild(div);
  });
}
buildLegend();

// ─── WANDER AI ────────────────────────────────────────────────
const SPEED=0.6;

function wander(t){
  if(!t.alive)return;
  t.wanderTimer--;
  if(t.wanderTimer>0)return;
  const range=6;
  const nc=Math.max(1,Math.min(COLS-2,Math.floor(t.px/T)+Math.floor(Math.random()*range*2+1)-range));
  const nr=Math.max(1,Math.min(ROWS-2,Math.floor(t.py/T)+Math.floor(Math.random()*range*2+1)-range));
  const tile=map[M(nr,nc)];
  if(tile!==TILE.WATER&&tile!==TILE.GOLD){
    t.targetPx=nc*T; t.targetPy=nr*T;
  }
  t.wanderTimer=150+Math.floor(Math.random()*250);
}

function moveT(t){
  if(!t.alive)return;
  const dx=t.targetPx-t.px, dy=t.targetPy-t.py;
  const dist=Math.sqrt(dx*dx+dy*dy);
  t.isMoving=dist>1.5;
  if(!t.isMoving)return;
  t.px+=dx/dist*SPEED;
  t.py+=dy/dist*SPEED;
  if(Math.abs(dx)>Math.abs(dy)) t.dir=dx>0?'right':'left';
  else t.dir=dy>0?'down':'up';
  t.frameTimer++;
  if(t.frameTimer>8){ t.frame=(t.frame+1)%4; t.frameTimer=0; }
}

// ─── SPRITE DRAWING (32-bit style, 20x20 characters) ─────────
function drawSprite(t){
  const px=Math.floor(t.px), py=Math.floor(t.py);
  const color=DC[t.district];
  const darker=shadeColor(color,-40);
  const lighter=shadeColor(color,60);
  const isWalking=t.isMoving&&t.alive;
  const legPhase=t.frame%2;
  const armPhase=t.frame%2;

  // Death animation
  if(!t.alive){
    if(t.deathTimer>0){
      const alpha=t.deathTimer/60;
      ctx.globalAlpha=alpha;
      ctx.fillStyle='#FF4444';
      ctx.fillRect(px-2,py-2,24,24);
      // Pixel X
      ctx.fillStyle='#ffffff';
      for(let i=0;i<20;i+=4){
        ctx.fillRect(px+i,py+i,4,4);
        ctx.fillRect(px+16-i,py+i,4,4);
      }
      ctx.globalAlpha=1;
      t.deathTimer--;
    }
    return;
  }

  ctx.globalAlpha=1;

  // ── SHADOW ──
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.fillRect(px+2,py+18,16,3);

  // ── LEGS ──
  if(t.dir==='down'||t.dir==='up'){
    ctx.fillStyle='#222233';
    ctx.fillRect(px+5, py+14, 4, isWalking?(6+legPhase*2):(6));
    ctx.fillRect(px+11,py+14, 4, isWalking?(6-legPhase*2+2):(6));
    // Boots
    ctx.fillStyle=darker;
    ctx.fillRect(px+4, py+14+(isWalking?6+legPhase*2:6), 5, 3);
    ctx.fillRect(px+10,py+14+(isWalking?6-legPhase*2+2:6),5, 3);
  } else {
    // Side view legs
    ctx.fillStyle='#222233';
    ctx.fillRect(px+7, py+14, 4, isWalking?(6+legPhase*2):6);
    ctx.fillStyle=darker;
    ctx.fillRect(px+6, py+14+(isWalking?6+legPhase*2:6), 6, 3);
  }

  // ── TORSO / ARMOUR ──
  ctx.fillStyle=color;
  ctx.fillRect(px+4,py+7,12,8);
  // Armour highlight
  ctx.fillStyle=lighter;
  ctx.fillRect(px+5,py+7,4,3);
  ctx.fillRect(px+5,py+8,2,5);
  // Armour shading
  ctx.fillStyle=darker;
  ctx.fillRect(px+12,py+7,4,8);
  ctx.fillRect(px+4,py+13,12,2);
  // Chest plate detail
  ctx.fillStyle=lighter;
  ctx.fillRect(px+8,py+9,4,2);

  // ── ARMS ──
  const aSwing=isWalking?(armPhase===0?2:-2):0;
  ctx.fillStyle=color;
  if(t.dir==='left'||t.dir==='right'){
    ctx.fillRect(px+(t.dir==='right'?2:14),py+7+aSwing,4,6);
    ctx.fillStyle='#f0c08a';
    ctx.fillRect(px+(t.dir==='right'?2:14),py+12+aSwing,3,3);
  } else {
    ctx.fillStyle=color;
    ctx.fillRect(px+0, py+7+aSwing,  4,6);
    ctx.fillRect(px+16,py+7-aSwing,  4,6);
    ctx.fillStyle='#f0c08a';
    ctx.fillRect(px+0, py+12+aSwing, 3,3);
    ctx.fillRect(px+16,py+12-aSwing, 3,3);
  }

  // ── HEAD ──
  // Neck
  ctx.fillStyle='#e0a87a';
  ctx.fillRect(px+8,py+4,4,4);

  // Head
  ctx.fillStyle='#f0c08a';
  ctx.fillRect(px+5,py-2,10,8);

  // Hair
  const hairColor=['#2a1a0a','#4a2a10','#8a6a30','#1a1a1a','#c8c8c8','#8a3a10','#dda060','#1a4a1a'];
  const hc=hairColor[parseInt(t.id.replace('t',''))%hairColor.length];
  ctx.fillStyle=hc;
  ctx.fillRect(px+4,py-3,12,4);
  ctx.fillRect(px+4,py-3,2,6);
  ctx.fillRect(px+14,py-3,2,5);

  // Eyes
  ctx.fillStyle='#111122';
  if(t.dir==='down'){
    ctx.fillRect(px+7,py+1,2,2);
    ctx.fillRect(px+11,py+1,2,2);
    // Eye whites
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.fillRect(px+7,py+1,1,1);
    ctx.fillRect(px+11,py+1,1,1);
  } else if(t.dir==='up'){
    ctx.fillStyle=hc;
    ctx.fillRect(px+4,py-1,12,4);
  } else if(t.dir==='right'){
    ctx.fillStyle='#111122';
    ctx.fillRect(px+12,py+1,2,2);
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.fillRect(px+12,py+1,1,1);
    // Side nose
    ctx.fillStyle='#d09060';
    ctx.fillRect(px+14,py+3,2,2);
  } else {
    ctx.fillStyle='#111122';
    ctx.fillRect(px+6,py+1,2,2);
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.fillRect(px+6,py+1,1,1);
    ctx.fillStyle='#d09060';
    ctx.fillRect(px+4,py+3,2,2);
  }

  // Mouth (slight expression)
  ctx.fillStyle='#c07050';
  if(t.dir==='down') ctx.fillRect(px+8,py+4,4,1);
  if(t.dir==='right') ctx.fillRect(px+13,py+4,2,1);
  if(t.dir==='left') ctx.fillRect(px+5,py+4,2,1);

  // ── DISTRICT COLOUR BADGE above head ──
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(px+4,py-10,12,6);
  ctx.fillStyle=color;
  ctx.fillRect(px+5,py-9,10,4);
  // D number
  ctx.fillStyle='rgba(0,0,0,0.8)';
  ctx.font='bold 6px monospace';
  ctx.textAlign='center';
  ctx.fillText('D'+t.district, px+10, py-6);
  ctx.textAlign='left';

  // ── HEALTH BAR ──
  const hpW=Math.floor((t.hp/100)*18);
  const hpColor=t.hp>60?'#44DD44':t.hp>30?'#DDCC00':'#DD4444';
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(px+1,py-14,18,4);
  ctx.fillStyle=hpColor;
  ctx.fillRect(px+1,py-14,hpW,4);
  ctx.strokeStyle='rgba(0,0,0,0.8)';
  ctx.lineWidth=1;
  ctx.strokeRect(px+1,py-14,18,4);
}

function shadeColor(hex,pct){
  const n=parseInt(hex.replace('#',''),16);
  const r=Math.max(0,Math.min(255,(n>>16)+pct));
  const g=Math.max(0,Math.min(255,((n>>8)&0xFF)+pct));
  const b=Math.max(0,Math.min(255,(n&0xFF)+pct));
  return `rgb(${r},${g},${b})`;
}

// ─── ANIMATED TILES (water, gold) ────────────────────────────
function drawAnimatedTiles(){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const type=map[M(r,c)];
    if(type!==TILE.WATER&&type!==TILE.GOLD&&type!==TILE.SHALLOW)continue;
    const x=c*T, y=r*T;
    if(type===TILE.WATER){
      const t2=Math.floor(Date.now()/500);
      ctx.fillStyle='rgba(255,255,255,0.07)';
      const off=(t2+c)%4;
      ctx.fillRect(x,y+off*5,T,2);
    } else if(type===TILE.SHALLOW){
      const t2=Math.floor(Date.now()/700);
      ctx.fillStyle='rgba(255,255,255,0.05)';
      ctx.fillRect(x,y+((t2+c)%4)*5,T,1);
    } else if(type===TILE.GOLD){
      const shimmer=Math.sin(Date.now()/300+r*0.5+c*0.5)*0.12+0.12;
      ctx.fillStyle=`rgba(255,220,50,${shimmer})`;
      ctx.fillRect(x,y,T,T);
      ctx.fillStyle='rgba(255,240,120,0.5)';
      ctx.fillRect(x+8,y+8,4,4);
    }
  }
}

// ─── MINIMAP ─────────────────────────────────────────────────
let selectedId=null;

function drawMinimap(){
  const mm=document.getElementById('minimapCanvas');
  if(!mm)return;
  const mc=mm.getContext('2d');
  mc.clearRect(0,0,80,80);
  // Terrain rough preview
  for(let r=0;r<ROWS;r+=2) for(let c=0;c<COLS;c+=2){
    const type=map[M(r,c)];
    const colors={
      [TILE.WATER]:'#1a4a8a',[TILE.SHALLOW]:'#2a6aa8',
      [TILE.TREE]:'#1a4d18',[TILE.TREE2]:'#0f3a0d',[TILE.PINE]:'#0d3020',
      [TILE.STONE]:'#5a5a5a',[TILE.CLIFF]:'#3a3a3a',
      [TILE.SAND]:'#c8a870',[TILE.SAND2]:'#b89460',
      [TILE.GOLD]:'#C9A84C',[TILE.DIRT]:'#6a4a2a',[TILE.PATH]:'#8a7050',
    };
    mc.fillStyle=colors[type]||'#3d8b3d';
    mc.fillRect(c/2,r/2,1,1);
  }
  // Tributes
  tributes.forEach(t=>{
    if(!t.alive)return;
    mc.fillStyle=t.id===selectedId?'#ffffff':DC[t.district];
    mc.fillRect(Math.floor(t.px/T/2),Math.floor(t.py/T/2),2,2);
  });
}

// ─── CAMERA ──────────────────────────────────────────────────
// Centre camera on the cornucopia initially
let camTargetX=40*T - canvas.width/2;
let camTargetY=40*T - canvas.height/2;
let viewX=camTargetX, viewY=camTargetY;

// Auto-pan: follow the action (average of alive tributes)
function updateCamera(){
  const alive=tributes.filter(t=>t.alive);
  if(!alive.length)return;
  const avgX=alive.reduce((s,t)=>s+t.px,0)/alive.length;
  const avgY=alive.reduce((s,t)=>s+t.py,0)/alive.length;
  // Smoothly pan camera toward action
  camTargetX=Math.max(0,Math.min(canvas.width-canvas.width,avgX-canvas.width/2));
  camTargetY=Math.max(0,Math.min(canvas.height-canvas.height,avgY-canvas.height/2));
}

// ─── MAIN LOOP ────────────────────────────────────────────────
let lastTs=0;
function loop(ts){
  const dt=ts-lastTs; lastTs=ts;

  // Update tributes
  tributes.forEach(t=>{ wander(t); moveT(t); });

  // Draw static map (offscreen baked)
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(offscreen,0,0);

  // Animated tiles on top
  drawAnimatedTiles();

  // Sort tributes by y (depth)
  const sorted=[...tributes].sort((a,b)=>a.py-b.py);
  sorted.forEach(t=>drawSprite(t));

  // Minimap
  drawMinimap();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.toggleFS=function(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
};
